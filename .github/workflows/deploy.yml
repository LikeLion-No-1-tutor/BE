name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

      - name: Package
        run: git archive --format=tar.gz -o release.tar.gz HEAD

      - name: Connect WireGuard
        env:
          WG_PRIVATE_KEY: ${{ secrets.WG_PRIVATE_KEY }}
          WG_ADDRESS: ${{ secrets.WG_ADDRESS }}
          WG_SERVER_PUBLIC_KEY: ${{ secrets.WG_SERVER_PUBLIC_KEY }}
          WG_ENDPOINT: ${{ secrets.WG_ENDPOINT }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq wireguard-tools
          sudo tee /etc/wireguard/wg0.conf > /dev/null <<EOF_WG
          [Interface]
          PrivateKey = $WG_PRIVATE_KEY
          Address = $WG_ADDRESS

          [Peer]
          PublicKey = $WG_SERVER_PUBLIC_KEY
          Endpoint = $WG_ENDPOINT
          AllowedIPs = $DEPLOY_HOST/32
          PersistentKeepalive = 25
          EOF_WG
          sudo chmod 600 /etc/wireguard/wg0.conf
          sudo wg-quick up wg0

      - name: Deploy
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            deploy@"$DEPLOY_HOST" deploy < release.tar.gz

      - name: Disconnect WireGuard
        if: always()
        run: sudo wg-quick down wg0 || true
